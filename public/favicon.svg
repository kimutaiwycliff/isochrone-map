<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#0f1117"/>

  <!-- Isochrone rings radiating from pin tip at (16, 20) -->
  <!-- Outer ring -->
  <circle cx="16" cy="20" r="10.5" fill="#1d4ed8" fill-opacity="0.12"
          stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.35"/>
  <!-- Middle ring -->
  <circle cx="16" cy="20" r="6.5" fill="#2563eb" fill-opacity="0.18"
          stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.55"/>
  <!-- Inner ring -->
  <circle cx="16" cy="20" r="3" fill="#3b82f6" fill-opacity="0.28"
          stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.8"/>

  <!-- Location pin (tip at 16,20 — same as ring center) -->
  <path d="M16 5 C12.4 5 9.5 7.9 9.5 11.5 C9.5 16.2 16 20 16 20 C16 20 22.5 16.2 22.5 11.5 C22.5 7.9 19.6 5 16 5 Z"
        fill="#60a5fa"/>
  <!-- Inner dot on pin head -->
  <circle cx="16" cy="11.5" r="2.8" fill="#0f1117" fill-opacity="0.45"/>
  <circle cx="16" cy="11.5" r="1.5" fill="white" fill-opacity="0.9"/>
</svg>
